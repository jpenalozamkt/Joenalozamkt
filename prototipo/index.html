<title>Hub de Cuentas JP MKT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell. Índigo rail on the left (top bar on phones), work canvas on paper to the right. */
:root{
  --ink:#141A33; --ink-2:#222A4D; --on-ink:#EEF0F7; --on-ink-muted:#A9B0CC;
  --paper:#F6F7FA; --sheet:#FFFFFF; --sheet-2:#F0F2F7;
  --signal:#E7A21A; --signal-soft:#FCF1D8; --signal-text:#8A5A00;
  --text:#1C2238; --muted:#5E6680; --line:#DCE0EA;
  --up:#23805A; --down:#B4473B; --blue:#3550C8; --violet:#6A4BC4;
  --shadow:0 1px 2px rgba(20,26,51,.05),0 6px 20px rgba(20,26,51,.06);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#0B0F1F; --ink-2:#1A2142; --on-ink:#EEF0F7; --on-ink-muted:#9AA2BD;
  --paper:#10142A; --sheet:#171C36; --sheet-2:#1D2342;
  --signal:#F2B33D; --signal-soft:#3A2E12; --signal-text:#F2C46A;
  --text:#E6E9F4; --muted:#9AA2BD; --line:#2A3150;
  --up:#4CC08C; --down:#E58276; --blue:#8EA2FF; --violet:#B39CFF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --ink:#0B0F1F; --ink-2:#1A2142; --on-ink:#EEF0F7; --on-ink-muted:#9AA2BD;
  --paper:#10142A; --sheet:#171C36; --sheet-2:#1D2342;
  --signal:#F2B33D; --signal-soft:#3A2E12; --signal-text:#F2C46A;
  --text:#E6E9F4; --muted:#9AA2BD; --line:#2A3150;
  --up:#4CC08C; --down:#E58276; --blue:#8EA2FF; --violet:#B39CFF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--text);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-brand{background:var(--ink);color:var(--on-ink);padding-block:48px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:40px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.login-brand h1{font-size:clamp(30px,4vw,46px);line-height:1.05;font-weight:800;max-width:14ch}
.login-brand h1 em{font-style:normal;color:var(--signal)}
.login-brand p{color:var(--on-ink-muted);max-width:44ch;font-size:15px}
.login-points{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.login-points li{display:flex;gap:10px;align-items:baseline;color:var(--on-ink)}
.login-points li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--signal);flex:none;transform:translateY(-1px)}
.login-form-wrap{display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.login-form{width:100%;max-width:380px;display:grid;gap:16px}
.login-form h2{font-size:26px}
.field{display:grid;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.input{width:100%;background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:42px}
.input:focus{border-color:var(--signal);outline:none;box-shadow:0 0 0 3px var(--signal-soft)}
textarea.input{min-height:72px;resize:vertical}
.error{color:var(--down);font-size:13px;min-height:1em}
.demo-box{border:1px dashed var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;background:var(--sheet)}
.demo-row{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- Buttons, chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:8px 14px;min-height:38px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn-primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
:root[data-theme="dark"] .btn-primary{background:var(--signal);color:#141A33;border-color:var(--signal)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-primary{background:var(--signal);color:#141A33;border-color:var(--signal)}}
.btn-signal{background:var(--signal);color:#141A33;border-color:var(--signal)}
.btn-ok{background:var(--up);border-color:var(--up);color:#fff}
.btn-ghost{background:transparent}
.btn-sm{min-height:30px;padding:4px 10px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap;--c:var(--muted);color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.chip.plain::before{display:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--sheet);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:6px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{background:var(--ink);color:var(--on-ink);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:22px;padding-block:22px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;color:var(--on-ink)}
.brand svg{width:36px;height:36px;flex:none}
.brand b{display:block;font-family:var(--f-display);font-size:13px;letter-spacing:.06em}
.brand span{display:block;font-family:var(--f-mono);font-size:10px;color:var(--on-ink-muted);letter-spacing:.04em}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--on-ink-muted);text-align:left;padding:9px 10px;border-radius:8px;font-weight:600}
.nav button:hover{background:var(--ink-2);color:var(--on-ink)}
.nav button[aria-current="page"]{background:var(--ink-2);color:var(--on-ink);box-shadow:inset 3px 0 0 var(--signal)}
.nav svg{width:17px;height:17px;flex:none}
.nav .badge{margin-left:auto;background:var(--signal);color:#141A33;font-size:11px;border-radius:999px;padding:0 7px;font-family:var(--f-mono)}
.rail-foot{margin-top:auto;display:grid;gap:10px;border-top:1px solid var(--ink-2);padding-top:14px}
.me{display:flex;gap:10px;align-items:center}
.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;font-family:var(--f-mono);background:var(--signal-soft);color:var(--signal-text);flex:none}
.av.DI{background:color-mix(in srgb,var(--violet) 18%,transparent);color:var(--violet)}
.av.CM{background:color-mix(in srgb,var(--blue) 18%,transparent);color:var(--blue)}
.rail .av{width:32px;height:32px}
.me div b{display:block;font-size:13px}
.me div span{display:block;font-size:11px;color:var(--on-ink-muted)}
.rail-foot .btn{background:transparent;color:var(--on-ink-muted);border-color:var(--ink-2)}

.main{min-width:0;padding-block:20px 60px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.client-pick{display:flex;align-items:center;gap:10px}
.client-pick select{min-width:200px}
.proto-note{font-size:12px;color:var(--signal-text);background:var(--signal-soft);border-radius:999px;padding:4px 12px;font-weight:600}
.page-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.page-head h1{font-size:clamp(22px,2.6vw,30px);font-weight:800}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.actions{display:flex;flex-wrap:wrap;gap:8px}

.panel{background:var(--sheet);border:1px solid var(--line);border-radius:12px}
.panel-pad{padding:18px}
.grid{display:grid;gap:14px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 12px}
.section-title h2{font-size:17px}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--sheet);padding:14px 16px;display:grid;gap:4px;align-content:start}
.kpi.lead{background:var(--signal-soft)}
.kpi .k-label{font-size:12px;color:var(--muted);font-weight:600}
.kpi .k-val{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .k-sub{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.up{color:var(--up)} .down{color:var(--down)}

/* Client cards */
.clients{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ccard{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;text-align:left;width:100%}
.ccard:hover{border-color:var(--muted)}
.ccard-head{display:flex;gap:10px;align-items:center}
.logo-tile{width:36px;height:36px;border-radius:9px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;flex:none}
.ccard h3{font-size:15px}
.ccard .sector{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--sheet-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--up);border-radius:99px}
.ccard-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:11.5px;color:var(--muted)}
.ccard-stats b{display:block;font-family:var(--f-display);font-size:17px;color:var(--text)}
.ccard-stats .warn b{color:var(--signal-text)}

.attn{display:grid;gap:0}
.attn-row{display:flex;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line);font-size:13px}
.attn-row:first-child{border-top:0}
.attn-row .grow{flex:1;min-width:0}

/* Sprint */
.sprint-head{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:14px;margin-bottom:16px}
.sprint-goal h2{font-size:20px;margin:6px 0 8px}
.ceremonies{display:grid;gap:8px;margin-top:12px;font-size:12.5px}
.ceremonies div{display:flex;gap:8px;align-items:baseline}
.ceremonies b{font-family:var(--f-mono);font-weight:500;color:var(--muted);min-width:76px;font-size:11.5px}
.chart-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.chart-title h3{font-size:14px}
svg.chart{width:100%;height:auto;display:block}
.board-wrap{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;min-width:960px}
.col{background:var(--sheet-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:240px;border:2px solid transparent;transition:border-color .15s}
.col.over{border-color:var(--signal)}
.col-head{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 4px;font-weight:700;font-size:13px}
.col-head .mono{font-size:11px;color:var(--muted);font-weight:400}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:11px 12px;display:grid;gap:8px;cursor:grab;box-shadow:var(--shadow);text-align:left;width:100%}
.card:active{cursor:grabbing}
.card.ro{cursor:default}
.card.dragging{opacity:.4}
.card h4{font-family:var(--f-body);font-size:13.5px;font-weight:600;line-height:1.35;letter-spacing:0}
.card-top,.card-foot{display:flex;align-items:center;gap:8px;justify-content:space-between}
.card-foot{justify-content:flex-start}
.card-foot .av{margin-left:auto;width:24px;height:24px;font-size:10px}
.ctag{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.pts{font-family:var(--f-mono);font-size:11px;background:var(--sheet-2);border-radius:5px;padding:1px 6px;color:var(--muted)}
.due{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.ttag{font-size:11px;border-radius:5px;padding:1px 7px;font-weight:600;--c:var(--muted);color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.retro{margin-top:16px}
.retro summary{cursor:pointer;font-weight:700;padding:14px 18px;list-style:none;display:flex;justify-content:space-between}
.retro summary::-webkit-details-marker{display:none}
.retro-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:0 18px 18px}
.retro-cols h4{font-size:13px;margin-bottom:6px}
.retro-cols ul{margin:0;padding-left:18px;color:var(--muted);font-size:13px;display:grid;gap:4px}

/* Tables */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--sheet)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sheet-2);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.row-click{cursor:pointer}
tr.row-click:hover td{background:color-mix(in srgb,var(--signal) 5%,transparent)}
tr.open td{background:color-mix(in srgb,var(--signal) 7%,transparent)}
.hook{font-weight:600;min-width:240px;max-width:340px}
.cell-sub{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.nowrap{white-space:nowrap}
.detail td{background:var(--paper);padding:0}
.detail-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:18px;padding:18px}
.copy-block{display:grid;gap:4px;margin-bottom:14px}
.copy-block p{margin:0;white-space:pre-line;max-width:70ch}
.side-box{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:12px;align-content:start}
.thread{display:grid;gap:8px}
.msg{font-size:13px;border-left:2px solid var(--line);padding-left:10px}
.msg b{font-size:12px}
.msg .when{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-left:6px}
.msg.internal{border-left-color:var(--violet)}
.cal-wrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(96px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:700px}
.cal .dow{background:var(--sheet-2);font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px}
.cal .day{background:var(--sheet);min-height:96px;padding:6px;display:flex;flex-direction:column;gap:4px}
.cal .day.out{background:var(--sheet-2)}
.cal .day.today .dnum{background:var(--signal);color:#141A33;border-radius:5px;padding:0 5px}
.dnum{font-family:var(--f-mono);font-size:11px;color:var(--muted);align-self:flex-start}
.cal-chip{border:0;text-align:left;font-size:11px;border-radius:5px;padding:3px 6px;font-weight:600;--c:var(--muted);color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);line-height:1.25}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}

/* Report */
.report{max-width:880px}
.rep-band{background:var(--ink);color:var(--on-ink);border-radius:14px 14px 0 0;padding:22px 24px 26px;display:grid;gap:14px}
.rep-band .brand span{color:var(--on-ink-muted)}
.rep-band .eyebrow{color:var(--signal)}
.rep-band h2{font-size:clamp(24px,3vw,32px);font-weight:800;line-height:1.1}
.rep-body{background:var(--sheet);border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;padding:0 0 22px}
.rep-body .kpis{border-radius:0;border-left:0;border-right:0;border-top:0}
.rep-sec{padding:20px 24px 0}
.rep-sec h3{font-size:15px;margin-bottom:10px}
.summary-line{font-size:16px;line-height:1.55;max-width:62ch;margin:0}
.summary-line mark{background:linear-gradient(transparent 60%,var(--signal-soft) 60%);color:inherit;font-weight:700}
.list-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.li-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px;font-size:13.5px}
.next{margin:20px 24px 0;background:var(--ink);color:var(--on-ink);border-radius:12px;padding:18px 20px}
.next h3{font-size:15px;margin-bottom:10px}
.next ol{margin:0;padding:0;list-style:none;display:grid;gap:8px;counter-reset:n}
.next li{display:flex;gap:10px;counter-increment:n}
.next li::before{content:counter(n);font-family:var(--f-display);font-weight:800;color:var(--signal);min-width:14px}
.next .goal{margin-top:12px;font-family:var(--f-mono);font-size:12px;color:var(--signal)}
.rep-foot{padding:18px 24px 0;font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}

/* Modal, toast */
.scrim{position:fixed;inset:0;background:rgba(10,13,28,.5);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:var(--sheet);border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:22px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{font-size:19px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:10px;font-size:13px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.empty{padding:36px 20px;text-align:center;display:grid;gap:10px;justify-items:center;color:var(--muted)}
.empty h3{color:var(--text);font-size:17px}

@media (max-width:1100px){.sprint-head{grid-template-columns:1fr 1fr}.sprint-head .sprint-goal{grid-column:1/-1}}
@media (max-width:860px){
  .login{grid-template-columns:1fr}
  .login-brand{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:32px}
  .shell{grid-template-columns:1fr}
  .rail{position:sticky;height:auto;flex-direction:row;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:20;overflow-x:auto;overflow-y:hidden}
  .brand div{display:none}
  .nav{display:flex;gap:4px}

function burndown(list){
  const total = list.reduce((a,t)=>a+t.pts,0) || 1;
  const done = list.filter(t=>t.st==='done').reduce((a,t)=>a+t.pts,0);
  const actual = [total, total - Math.round(done*.35), total - Math.round(done*.7), total - done];
  const W=320,H=150,L=30,R=10,T=10,B=26, n=10;
  const x = i => L + i*(W-L-R)/(n-1), y = v => T + (1 - v/total)*(H-T-B);
  const ticks = [0, Math.round(total/2), total];
  const days = ['9','10','11','12','13','16','17','18','19','20'];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Burndown: quedan ${total-done} de ${total} puntos">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" font-size="9" text-anchor="end" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${v}</text>`).join('')}
    ${days.map((d,i)=>`<text x="${x(i)}" y="${H-8}" font-size="9" text-anchor="middle" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${d}</text>`).join('')}
    <line x1="${x(0)}" y1="${y(total)}" x2="${x(n-1)}" y2="${y(0)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1.5"/>
    <path d="M${actual.map((v,i)=>`${x(i)},${y(v)}`).join(' L')} L${x(actual.length-1)},${y(0)} L${x(0)},${y(0)} Z" fill="var(--signal)" fill-opacity=".14"/>
    <polyline points="${actual.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="var(--signal)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${x(3)}" cy="${y(actual[3])}" r="4" fill="var(--signal)" stroke="var(--sheet)" stroke-width="2"/>
    <text x="${x(3)+8}" y="${y(actual[3])-6}" font-size="10" fill="var(--text)" font-family="IBM Plex Mono, monospace">${total-done} pts</text>
  </svg>`;
}
function velocity(done){
  const data = [['S43',34],['S44',38],['S45',41],['S46',done]];
  const W=320,H=150,L=30,B=26,T=14, max=50, bw=40;
  const y = v => T + (1 - v/max)*(H-T-B);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Velocidad por sprint">
    ${[0,25,50].map(v=>`<line x1="${L}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+3}" font-size="9" text-anchor="end" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${v}</text>`).join('')}
    ${data.map(([s,v],i)=>{const cx = L + 26 + i*68; const cur = i===3; return `<rect x="${cx}" y="${y(v)}" width="${bw}" height="${y(0)-y(v)}" rx="4" fill="${cur?'var(--signal)':'var(--ink)'}" fill-opacity="${cur?1:.8}"/><text x="${cx+bw/2}" y="${y(v)-5}" font-size="10" text-anchor="middle" fill="var(--text)" font-family="IBM Plex Mono, monospace">${v}</text><text x="${cx+bw/2}" y="${H-8}" font-size="9" text-anchor="middle" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${s}${cur?' · en curso':''}</text>`}).join('')}

}

function calendar(rows){
  const first = new Date(2026,10,1), offset = (first.getDay()+6)%7, daysIn = 30;
  const cells = [];
  for (let i=0;i<offset;i++) cells.push('<div class="day out"></div>');
  for (let d=1; d<=daysIn; d++){
    const iso = `2026-11-${String(d).padStart(2,'0')}`;
    const items = rows.filter(r => r.f === iso);
    cells.push(`<div class="day ${iso===TODAY?'today':''}"><span class="dnum">${d}</span>${items.map(r => `<button class="cal-chip" style="--c:${P_COLOR[r.st]}" data-action="goto-piece" data-client="${currentClient()}" data-id="${r.id}">${r.id}<br><span style="font-weight:500">${esc(r.fmt.split(' ')[0])}</span></button>`).join('')}</div>`);
  }
  while (cells.length % 7) cells.push('<div class="day out"></div>');
  return `<div class="cal-wrap"><div class="cal">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells.join('')}</div></div>`;
}

function spark(vals){
  const W=300,H=70,P=6, max=Math.max(...vals), min=Math.min(...vals);
  const x=i=>P+i*(W-2*P)/(vals.length-1), y=v=>P+(1-(v-min)/((max-min)||1))*(H-2*P-10);
  const pts = vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tendencia"><polygon points="${x(0)},${H-4} ${pts} ${x(vals.length-1)},${H-4}" fill="var(--signal)" fill-opacity=".14"/><polyline points="${pts}" fill="none" stroke="var(--signal)" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${x(vals.length-1)}" cy="${y(vals.at(-1))}" r="4" fill="var(--signal)" stroke="var(--sheet)" stroke-width="2"/></svg>`;
}

        <td>${esc(u.accounts)}</td><td class="r"><button class="btn btn-sm" data-action="reset-pass" data-user="${esc(u.user)}">Restablecer contraseña</button></td></tr>`).join('')}</tbody>
    </table></div>
    <form class="panel panel-pad" id="new-user" style="display:grid;gap:12px;align-content:start" novalidate>
      <h3 style="font-size:16px">Nuevo usuario</h3>
      <div class="field"><label for="nu-name">Nombre</label><input class="input" id="nu-name" placeholder="Ej. Cliente Mesón"></div>
      <div class="field"><label for="nu-user">Usuario</label><input class="input" id="nu-user" placeholder="ej. meson"></div>
      <div class="field"><label for="nu-role">Rol</label><select class="input" id="nu-role"><option value="cliente">Cliente</option><option value="equipo">Equipo</option></select></div>
      <div class="field"><label for="nu-acc">Cuenta</label><select class="input" id="nu-acc">${CLIENTS.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
      <span class="error" id="nu-err"></span>
      <button class="btn btn-primary" type="submit">Crear y generar contraseña</button>
    </form>
  </div>`;
}

/* ============================================================
   MODAL
   ============================================================ */
function modal(){
  const m = state.modal;
  if (m.type === 'task'){
    const t = TASKS.find(x => x.id === m.id);
    return `<div class="scrim" data-action="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div><span class="eyebrow">${esc(cname(t.c))} · ${t.id.toUpperCase()}</span><h3 id="mt">${esc(t.title)}</h3></div><button class="btn btn-sm btn-ghost" data-action="close-modal" aria-label="Cerrar">✕</button></div>
      <dl class="kv">
        <dt>Estado</dt><dd><select class="input" style="min-height:34px;padding:4px 8px" data-change="task-status" data-id="${t.id}">${COLS.map(c=>`<option value="${c.id}" ${c.id===t.st?'selected':''}>${c.label}</option>`).join('')}</select></dd>
        <dt>Responsable</dt><dd>${esc(TEAM[t.who].name)} · <span class="muted">${esc(TEAM[t.who].role)}</span></dd>
        <dt>Story points</dt><dd class="mono">${t.pts}</dd>
        <dt>Tipo</dt><dd><span class="ttag" style="--c:${TYPE_COLOR[t.type]}">${t.type}</span></dd>
        <dt>Fecha límite</dt><dd>${fday(t.due)} ${fdate(t.due)}</dd>
      </dl>
      <div><span class="eyebrow">Criterios de aceptación</span>
        <div style="display:grid;gap:6px;margin-top:8px">
          <label class="check"><input type="checkbox" id="ck1-${t.id}" ${t.st==='done'?'checked':''}> Revisado contra la guía creativa</label>
          <label class="check"><input type="checkbox" id="ck2-${t.id}" ${t.st==='done'?'checked':''}> Formato y medidas correctos</label>
          <label class="check"><input type="checkbox" id="ck3-${t.id}"> Ligado a su pieza en la parrilla</label>
        </div></div>
      <div class="field"><label for="tc-${t.id}">Comentario interno</label><textarea class="input" id="tc-${t.id}" placeholder="Solo lo ve el equipo"></textarea></div>
    </div></div>`;
  }
  return '';
}

/* ============================================================
   RENDER Y EVENTOS
   ============================================================ */
function render(){
  if (!state.user){ $('#app').innerHTML = viewLogin(); return; }
  const v = {inicio:viewInicio, tablero:viewTablero, backlog:viewBacklog, parrilla:viewParrilla, campanas:viewCampanas, reportes:viewReportes, accesos:viewAccesos}[state.view] || viewInicio;
  $('#app').innerHTML = shell(v());
  bindDnD();
}
function login(username, pass){
  const u = USERS.find(x => x.user === username.trim().toLowerCase());
  if (!u || pass !== 'demo'){ state.loginErr = 'Usuario o contraseña incorrectos. En el prototipo la contraseña es «demo».'; render(); return; }
  state.user = u; state.loginErr = ''; state.view = 'inicio';
  state.client = u.role === 'cliente' ? u.client : 'all';
  render(); window.scrollTo(0,0);
}
function go(view){
  state.view = view; state.open = null;
  if (['parrilla','campanas','reportes'].includes(view) && state.client === 'all' && isStaff()) state.client = 'taxbox';
  render(); window.scrollTo(0,0);
}
function bindDnD(){
  if (isClient()) return;
  document.querySelectorAll('.card[draggable]').forEach(card => {
    card.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', card.dataset.task); card.classList.add('dragging'); });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
  });
  document.querySelectorAll('.col[data-col]').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', () => col.classList.remove('over'));
    col.addEventListener('drop', e => {
      e.preventDefault(); col.classList.remove('over');
      const t = TASKS.find(x => x.id === e.dataTransfer.getData('text/plain'));
      if (t && t.st !== col.dataset.col){ t.st = col.dataset.col; render(); toast(`Movida a «${COLS.find(c=>c.id===t.st).label}»`); }
    });
  });
}
function addMsg(r, text){
  r.thread.push({who: state.user.name, t:text, when: fdate(TODAY)});
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || !el.dataset.action) return;
  const a = el.dataset.action, id = el.dataset.id;
  if (a === 'close-modal'){ if (e.target === el || el.tagName === 'BUTTON'){ state.modal = null; render(); } return; }
  switch (a){
    case 'login-as': $('#lg-user').value = el.dataset.user; $('#lg-pass').value = 'demo'; login(el.dataset.user, 'demo'); break;
    case 'logout': state.user = null; state.modal = null; render(); break;
    case 'nav': go(el.dataset.view); break;
    case 'open-client': state.client = el.dataset.client; go('tablero'); break;
    case 'goto-piece': state.client = isClient() ? state.client : el.dataset.client; state.pmode = 'tabla'; state.view = 'parrilla'; state.open = id; render();
      setTimeout(() => document.querySelector(`tr[data-id="${id}"]`)?.scrollIntoView({behavior:'smooth', block:'center'}), 30); break;
    case 'open-task': state.modal = {type:'task', id: el.dataset.task}; render(); break;
    case 'toggle-row': if (e.target.closest('.detail')) return; state.open = state.open === id ? null : id; render(); break;
    case 'pmode': state.pmode = el.dataset.mode; render(); break;
    case 'platform': state.platform = el.dataset.pl; render(); break;
    case 'rmode': state.rmode = el.dataset.mode; render(); break;
    case 'approve': { const r = PARRILLA[currentClient()].find(x => x.id === id); r.st = 'Autorizado'; addMsg(r, 'Autorizó la pieza.'); render(); toast(`${id} autorizada. El equipo recibe aviso.`); break; }
    case 'request-changes': { const txt = $('#cm-'+id).value.trim(); if (!txt){ $('#err-'+id).textContent = 'Escribe qué cambio necesitas para que el equipo lo atienda.'; $('#cm-'+id).focus(); return; }
      const r = PARRILLA[currentClient()].find(x => x.id === id); r.st = 'Cambios'; addMsg(r, txt); render(); toast(`Cambios solicitados en ${id}.`); break; }
    case 'comment': { const txt = $('#cm-'+id).value.trim(); if (!txt){ $('#err-'+id).textContent = 'Escribe un comentario antes de enviarlo.'; return; }
      const r = PARRILLA[currentClient()].find(x => x.id === id); addMsg(r, txt); render(); toast('Comentario enviado.'); break; }
    case 'approve-all': { const rows = PARRILLA[currentClient()].filter(r => r.st === 'Por aprobar'); rows.forEach(r => { r.st = 'Autorizado'; addMsg(r, 'Autorizó la pieza.'); }); render(); toast(`${rows.length} piezas autorizadas.`); break; }
    case 'to-sprint': { const i = BACKLOG.findIndex(b => b.id === id); const b = BACKLOG.splice(i,1)[0];
      TASKS.push({id:'t'+(TASKS.length+1)+b.id, c:b.c, title:b.title, type:b.type, who: b.type==='Diseño'||b.type==='Video'?'DI':b.type==='Community'?'CM':'JP', pts:b.pts, st:'todo', due:'2026-11-20'});
      render(); toast('Movida al sprint 46, columna «Por hacer».'); break; }
    case 'import-sheet': toast('En la versión final pegas el enlace del Google Sheet y se importan sus columnas.'); break;
    case 'upload-csv': toast('En la versión final subes el CSV exportado y se reconocen las columnas de cada plataforma.'); break;
    case 'new-task': toast('En la versión final se abre el formulario de nueva tarea.'); break;
    case 'new-piece': toast('En la versión final se agrega una fila nueva a la parrilla.'); break;
    case 'publish-report': toast('Reporte publicado. El cliente lo ve en su portal.'); break;
    case 'reset-pass': toast(`Se generó una contraseña temporal para «${el.dataset.user}».`); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.modal){ state.modal = null; render(); }
  if (e.key === 'Enter' && e.target.matches('.card[data-action="open-task"], tr.row-click')) e.target.click();
});
document.addEventListener('change', e => {
  const k = e.target.dataset.change; if (!k) return;
  if (k === 'client'){ state.client = e.target.value; state.open = null; render(); }
  if (k === 'piece-status'){ const r = PARRILLA[currentClient()].find(x => x.id === e.target.dataset.id); r.st = e.target.value; render(); toast(`${r.id}: ${r.st}`); }
  if (k === 'task-status'){ const t = TASKS.find(x => x.id === e.target.dataset.id); t.st = e.target.value; render(); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'login-form') login($('#lg-user').value, $('#lg-pass').value);
  if (e.target.id === 'new-user'){
    const name = $('#nu-name').value.trim(), user = $('#nu-user').value.trim().toLowerCase(), r = $('#nu-role').value, acc = $('#nu-acc').value;
    if (!name || !user){ $('#nu-err').textContent = 'Escribe nombre y usuario.'; return; }
    if (USERS.some(u => u.user === user)){ $('#nu-err').textContent = 'Ese usuario ya existe. Elige otro.'; return; }
    if (r === 'equipo' && USERS.filter(u => u.role !== 'cliente').length >= 5){ $('#nu-err').textContent = 'Ya usas los 5 lugares de equipo.'; return; }
    USERS.push({user, name, role:r, ini:name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(), accounts: r==='equipo'?'Todas':cname(acc), client:acc});
    render(); toast(`Usuario «${user}» creado con contraseña temporal.`);
  }
});
render();
</script>
