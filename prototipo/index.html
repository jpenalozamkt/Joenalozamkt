<title>Hub de Cuentas JP MKT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell. Riel oscuro a la izquierda (barra superior en teléfono) y lienzo de trabajo claro a la derecha.
   Identidad Jorge Peñaloza MKT: negro grafito, acento cian, píldoras y radios amplios. */
:root{
  --night:#0E0F12; --night-2:#18191D; --night-3:#2B2D33; --on-night:#FFFFFF; --on-night-muted:#A6AAB3;
  --paper:#F7F7F8; --sheet:#FFFFFF; --sheet-2:#EEEFF1;
  --accent:#23BBEE; --accent-text:#0A82AE; --on-accent:#0B0C0E; --accent-soft:#E2F5FC;
  --text:#0B0C0E; --muted:#4B4E57; --mist:#A6AAB3; --line:#E1E2E6;
  --up:#1D8456; --down:#B4432F; --warn:#9A6A0B; --violet:#6748C2;
  --shadow:0 18px 40px -22px rgba(11,12,14,.35);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Avenir Next","Segoe UI",system-ui,sans-serif;
  --r-lg:24px; --r-md:16px; --r-sm:10px;
  --ease:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --night:#0B0C0E; --night-2:#18191D; --night-3:#2B2D33; --on-night:#FFFFFF; --on-night-muted:#A6AAB3;
  --paper:#111215; --sheet:#18191D; --sheet-2:#1F2126;
  --accent:#23BBEE; --accent-text:#5CCFF3; --on-accent:#0B0C0E; --accent-soft:#0F2E3A;
  --text:#F2F3F5; --muted:#A6AAB3; --mist:#6B6F78; --line:#2B2D33;
  --up:#4CC08C; --down:#E5806C; --warn:#E2B04A; --violet:#B39CFF;
  --shadow:0 18px 40px -22px rgba(0,0,0,.7); color-scheme:dark;}}
:root[data-theme="dark"]{
  --night:#0B0C0E; --night-2:#18191D; --night-3:#2B2D33; --on-night:#FFFFFF; --on-night-muted:#A6AAB3;
  --paper:#111215; --sheet:#18191D; --sheet-2:#1F2126;
  --accent:#23BBEE; --accent-text:#5CCFF3; --on-accent:#0B0C0E; --accent-soft:#0F2E3A;
  --text:#F2F3F5; --muted:#A6AAB3; --mist:#6B6F78; --line:#2B2D33;
  --up:#4CC08C; --down:#E5806C; --warn:#E2B04A; --violet:#B39CFF;
  --shadow:0 18px 40px -22px rgba(0,0,0,.7); color-scheme:dark;}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--text);font-family:var(--f-body);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--night)}
::selection{background:var(--accent);color:var(--on-accent)}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.08;letter-spacing:-.03em;text-wrap:balance;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:12px;font-weight:600;font-size:13px;color:var(--muted)}
.tag::before{content:"";flex:none;width:8px;height:8px;margin-left:4px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 24%,transparent)}
.hl{display:inline-block;background:var(--accent);color:var(--on-accent);border-radius:99px;padding:0 .3em .06em;line-height:1.12;transform:rotate(-1.5deg)}

/* ---------- Logo (provisional) ---------- */
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:-.02em;white-space:nowrap;color:var(--on-night)}
.logo-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:13px;flex:none}
.logo small{font-family:var(--f-body);font-weight:700;font-size:10.5px;letter-spacing:.12em;background:var(--accent);color:var(--on-accent);padding:3px 7px;border-radius:99px;margin-left:4px;vertical-align:2px}

/* ---------- Botones ---------- */
.btn{--bg:var(--sheet);--fg:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:99px;padding:8px 18px;min-height:40px;font-weight:700;font-size:13.5px;white-space:nowrap;transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .2s}
.btn:hover{border-color:var(--mist)}
.btn-primary{--bg:var(--accent);--fg:var(--on-accent);border-color:transparent;padding:6px 6px 6px 18px}
.btn-primary .dot{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--on-accent);color:var(--accent);transition:transform .4s var(--ease)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 26px -14px rgba(11,12,14,.55)}
.btn-primary:hover .dot{transform:rotate(45deg)}
.btn-dark{--bg:var(--night);--fg:var(--on-night);border-color:var(--night)}
.btn-ok{--bg:var(--up);--fg:#fff;border-color:transparent}
.btn-ghost{--bg:transparent;border-color:transparent}
.btn-sm{min-height:32px;padding:4px 12px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none!important}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap;--c:var(--muted);color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px;background:var(--sheet);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:99px;padding:6px 14px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--night);color:var(--on-night)}

/* ---------- Formularios ---------- */
.field{display:grid;gap:6px}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.input{width:100%;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;min-height:42px}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
textarea.input{min-height:76px;resize:vertical}
.error{color:var(--down);font-size:13px;min-height:1em}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.login-brand{background:var(--night);color:var(--on-night);padding-block:44px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:40px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.login-brand h1{font-size:clamp(34px,4.6vw,58px);font-weight:800;letter-spacing:-.04em;max-width:13ch}
.login-brand p{color:var(--on-night-muted);max-width:46ch;font-size:16px}
.login-brand .tag{color:var(--on-night-muted)}
.login-points{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.login-points li{display:flex;gap:12px;align-items:baseline}
.login-points li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;transform:translateY(-2px)}
.login-side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding-block:40px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.login-form{width:100%;max-width:420px;display:grid;gap:14px}
.login-form h2{font-size:30px}
.tour{width:100%;max-width:420px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--sheet);padding:16px;display:grid;gap:12px}
.tour-row{display:grid;gap:8px}
.tour-row b{font-size:13px}
.tour-links{display:flex;flex-wrap:wrap;gap:6px}
.tour-links button{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:3px 11px;font-size:12px;font-weight:600}
.tour-links button:hover{border-color:var(--accent);color:var(--accent-text)}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.rail{background:var(--night);color:var(--on-night);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:24px;padding-block:22px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;overflow-y:auto;border-right:1px solid var(--night-3)}
.nav{display:grid;gap:3px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:var(--on-night-muted);text-align:left;padding:9px 12px;border-radius:99px;font-weight:600}
.nav button:hover{background:var(--night-2);color:var(--on-night)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.nav svg{width:17px;height:17px;flex:none}
.nav .badge{margin-left:auto;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;border-radius:99px;padding:0 7px}
.nav button[aria-current="page"] .badge{background:var(--on-accent);color:var(--accent)}
.rail-foot{margin-top:auto;display:grid;gap:10px;border-top:1px solid var(--night-3);padding-top:14px}
.me{display:flex;gap:10px;align-items:center}
.me-txt b{display:block;font-size:13px}
.me-txt span{display:block;font-size:11.5px;color:var(--on-night-muted)}
.rail-foot .btn{--bg:transparent;--fg:var(--on-night-muted);border-color:var(--night-3)}
.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:800;background:var(--accent-soft);color:var(--accent-text);flex:none}
.av.DI{background:color-mix(in srgb,var(--violet) 16%,transparent);color:var(--violet)}
.av.CM{background:color-mix(in srgb,var(--up) 16%,transparent);color:var(--up)}
.rail .av{background:var(--accent);color:var(--on-accent)}

.main{min-width:0;padding-block:20px 64px;padding-left:30px;padding-right:max(30px,env(safe-area-inset-right,0px))}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:22px}
.picker{display:flex;align-items:center;gap:10px}
.picker select{min-width:230px;border-radius:99px;padding-inline:16px}
.topbar-end{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.viewas{display:flex;align-items:center;gap:8px;background:var(--accent-soft);border-radius:99px;padding:3px 3px 3px 14px}
.viewas label{font-size:12px;font-weight:700;color:var(--accent-text);white-space:nowrap}
.viewas select{border:0;background:var(--sheet);border-radius:99px;padding:5px 10px;font-size:12.5px;font-weight:600}
.page-head{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.page-head h1{font-size:clamp(26px,3vw,38px);font-weight:800;letter-spacing:-.04em;margin-top:8px}
.page-head p{margin-top:6px;color:var(--muted);max-width:62ch}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.panel{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r-md)}
.panel-pad{padding:18px 20px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:30px 0 12px;flex-wrap:wrap}
.section-title h2{font-size:19px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(156px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.kpi{background:var(--sheet);padding:15px 17px;display:grid;gap:3px;align-content:start}
.kpi.lead{background:var(--night);color:var(--on-night)}
.kpi.lead .k-label,.kpi.lead .k-sub{color:var(--on-night-muted)}
.kpi.lead .k-val{color:var(--accent)}
.k-label{font-size:12.5px;color:var(--muted);font-weight:600}
.k-val{font-family:var(--f-display);font-size:28px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.k-sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.up{color:var(--up)!important} .down{color:var(--down)!important}

/* Clientes */
.group-head{display:flex;align-items:center;gap:12px;margin:22px 0 10px;flex-wrap:wrap}
.group-head h3{font-size:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ccard{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;display:grid;gap:12px;text-align:left;width:100%;transition:border-color .2s,transform .3s var(--ease)}
.ccard:hover{border-color:var(--accent);transform:translateY(-2px)}
.ccard-head{display:flex;gap:10px;align-items:center}
.mono-tile{width:38px;height:38px;border-radius:50%;background:var(--night);color:var(--on-night);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;flex:none}
.ccard h4{font-size:15px}
.ccard .sub{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--sheet-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.cstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:11.5px;color:var(--muted)}
.cstats b{display:block;font-family:var(--f-display);font-size:18px;color:var(--text)}
.cstats .warn b{color:var(--warn)}
.list{display:grid}
.list-row{display:flex;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);font-size:13.5px}
.list-row:first-child{border-top:0}
.list-row .grow{flex:1;min-width:0}
.cell-sub{display:block;font-size:12px;color:var(--muted);font-weight:400}

/* Sprint */
.sprint-head{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:14px;margin-bottom:16px}
.goal{background:var(--night);color:var(--on-night);border-color:var(--night)}
.goal .eyebrow{color:var(--accent)}
.goal h2{font-size:21px;margin:8px 0 12px}
.cer{display:grid;gap:6px;font-size:13px}
.cer div{display:flex;gap:10px}
.cer b{color:var(--on-night-muted);font-weight:600;min-width:62px}
.chart-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.chart-title h3{font-size:15px}
svg.chart{width:100%;height:auto;display:block}
.board-wrap{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;min-width:960px}
.col{background:var(--sheet-2);border-radius:var(--r-md);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:220px;border:2px dashed transparent;transition:border-color .15s}
.col.over{border-color:var(--accent)}
.col-head{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;font-weight:700;font-size:13.5px}
.col-head span:last-child{font-size:11.5px;color:var(--muted);font-weight:600}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;cursor:grab;text-align:left;width:100%}
.card:hover{border-color:var(--mist)}
.card.ro{cursor:default}
.card.dragging{opacity:.4}
.card h4{font-family:var(--f-body);font-size:13.5px;font-weight:700;line-height:1.35;letter-spacing:0}
.card-top,.card-foot{display:flex;align-items:center;gap:8px;justify-content:space-between}
.card-foot{justify-content:flex-start}
.card-foot .av{margin-left:auto;width:24px;height:24px;font-size:10px}
.btag{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pts{font-size:11px;font-weight:700;background:var(--sheet-2);border-radius:99px;padding:1px 8px;color:var(--muted)}
.due{font-size:11.5px;color:var(--muted)}
.ttag{font-size:11px;border-radius:99px;padding:1px 9px;font-weight:700;--c:var(--muted);color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.retro{margin-top:16px}
.retro summary{cursor:pointer;font-weight:700;padding:15px 20px;list-style:none;display:flex;justify-content:space-between;font-family:var(--f-display);font-size:16px}
.retro summary::-webkit-details-marker{display:none}
.retro-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:0 20px 20px}
.retro-cols h4{font-size:14px;margin-bottom:6px}
.retro-cols ul{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px;display:grid;gap:4px}

/* Mis tareas */
.my-row{display:flex;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.my-row:first-child{border-top:0}
.my-row .grow{flex:1;min-width:200px}
.my-row h4{font-family:var(--f-body);font-size:14px;font-weight:700;letter-spacing:0}
.late{color:var(--down);font-weight:700}

/* Tablas */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--sheet)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);background:var(--sheet-2);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.n{font-variant-numeric:tabular-nums}
tr.row-click{cursor:pointer}
tr.row-click:hover td{background:color-mix(in srgb,var(--accent) 5%,transparent)}
tr.open td{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.hook{font-weight:700;min-width:240px;max-width:340px}
.nowrap{white-space:nowrap}
.detail td{background:var(--paper);padding:0}
.detail-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:18px;padding:18px}
.copy-block{display:grid;gap:4px;margin-bottom:14px}
.copy-block p{white-space:pre-line;max-width:70ch}
.side-box{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;display:grid;gap:12px;align-content:start}
.thread{display:grid;gap:8px}
.msg{font-size:13.5px;border-left:3px solid var(--line);padding-left:10px}
.msg b{font-size:12.5px}
.msg .when{font-size:11px;color:var(--muted);margin-left:6px}
.msg.internal{border-left-color:var(--violet)}
.cal-wrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(96px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;min-width:700px}
.cal .dow{background:var(--sheet-2);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px}
.cal .day{background:var(--sheet);min-height:98px;padding:6px;display:flex;flex-direction:column;gap:4px}
.cal .day.out{background:var(--sheet-2)}
.dnum{font-size:11.5px;font-weight:600;color:var(--muted);align-self:flex-start}
.cal .day.today .dnum{background:var(--accent);color:var(--on-accent);border-radius:99px;padding:0 7px}
.cal-chip{border:0;text-align:left;font-size:11px;border-radius:8px;padding:3px 7px;font-weight:700;--c:var(--muted);color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);line-height:1.25}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}

/* Reporte */
.report{max-width:900px}
.rep-band{background:var(--night);color:var(--on-night);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:24px 26px 30px;display:grid;gap:14px}
.rep-band .tag{color:var(--on-night-muted)}
.rep-band h2{font-size:clamp(28px,3.6vw,42px);font-weight:800;letter-spacing:-.04em}

function burndown(list){
  const total = list.reduce((a,t)=>a+t.pts,0) || 1, done = list.filter(t=>t.st==='done').reduce((a,t)=>a+t.pts,0);
  const actual = [total, total - Math.round(done*.3), total - Math.round(done*.65), total - done];
  const W=320,H=150,L=30,R=12,T=12,Bt=26,n=5;
  const x = i => L + i*(W-L-R)/(n-1), y = v => T + (1 - v/total)*(H-T-Bt);
  const days = ['Lun 9','Mar 10','Mié 11','Jue 12','Vie 13'];
  const F = 'font-family="Figtree, sans-serif"';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Burndown: quedan ${total-done} de ${total} puntos">
    ${[0, Math.round(total/2), total].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+3}" font-size="9" text-anchor="end" fill="var(--muted)" ${F}>${v}</text>`).join('')}
    ${days.map((d,i)=>`<text x="${x(i)}" y="${H-8}" font-size="9" text-anchor="middle" fill="var(--muted)" ${F}>${d}</text>`).join('')}
    <line x1="${x(0)}" y1="${y(total)}" x2="${x(n-1)}" y2="${y(0)}" stroke="var(--mist)" stroke-dasharray="4 4" stroke-width="1.5"/>
    <path d="M${actual.map((v,i)=>`${x(i)},${y(v)}`).join(' L')} L${x(3)},${y(0)} L${x(0)},${y(0)} Z" fill="var(--accent)" fill-opacity=".15"/>
    <polyline points="${actual.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${x(3)}" cy="${y(actual[3])}" r="4.5" fill="var(--accent)" stroke="var(--sheet)" stroke-width="2"/>
    <text x="${x(3)-8}" y="${y(actual[3])-9}" font-size="10.5" font-weight="700" text-anchor="end" fill="var(--text)" ${F}>quedan ${total-done} pts</text>
  </svg>`;
}
function velocity(done){
  const data = [['S43',22],['S44',25],['S45',27],['S46',done]];
  const W=320,H=150,L=30,Bt=26,T=16,max=40,bw=40, F='font-family="Figtree, sans-serif"';
  const y = v => T + (1 - v/max)*(H-T-Bt);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Velocidad por sprint semanal">
    ${[0,20,40].map(v=>`<line x1="${L}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+3}" font-size="9" text-anchor="end" fill="var(--muted)" ${F}>${v}</text>`).join('')}
    ${data.map(([s,v],i)=>{const cx = L + 22 + i*68, cur = i===3; return `<rect x="${cx}" y="${y(v)}" width="${bw}" height="${y(0)-y(v)}" rx="8" fill="${cur?'var(--accent)':'var(--text)'}" fill-opacity="${cur?1:.85}"/><text x="${cx+bw/2}" y="${y(v)-5}" font-size="10.5" font-weight="700" text-anchor="middle" fill="var(--text)" ${F}>${v}</text><text x="${cx+bw/2}" y="${H-8}" font-size="9" text-anchor="middle" fill="var(--muted)" ${F}>${s}${cur?' · en curso':''}</text>`}).join('')}
  </svg>`;
}

function calendar(rows, c){
  const offset = (new Date(2026,10,1).getDay()+6)%7, cells = [];
  for (let i=0;i<offset;i++) cells.push('<div class="day out"></div>');
  for (let d=1; d<=30; d++){
    const iso = `2026-11-${String(d).padStart(2,'0')}`, items = rows.filter(r => r.f === iso);
    cells.push(`<div class="day ${iso===TODAY?'today':''}"><span class="dnum">${d}</span>${items.map(r => `<button class="cal-chip" style="--c:${P_COLOR[r.st]}" data-action="goto-piece" data-brand="${c}" data-id="${r.id}">${r.id}<br><span style="font-weight:500">${esc(r.fmt.split(' ')[0])}</span></button>`).join('')}</div>`);
  }
  while (cells.length % 7) cells.push('<div class="day out"></div>');
  return `<div class="cal-wrap"><div class="cal">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells.join('')}</div></div>`;
}

function spark(vals){
  const W=640,H=110,P=8, max=Math.max(...vals), min=Math.min(...vals);
  const x=i=>P+i*(W-2*P)/(vals.length-1), y=v=>P+(1-(v-min)/((max-min)||1))*(H-2*P-10);
  const pts = vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tendencia"><polygon points="${x(0)},${H-4} ${pts} ${x(vals.length-1)},${H-4}" fill="var(--accent)" fill-opacity=".15"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${x(vals.length-1)}" cy="${y(vals.at(-1))}" r="4.5" fill="var(--accent)" stroke="var(--sheet)" stroke-width="2"/></svg>`;
}

        <span class="error" id="im-err"></span></form>`
      : `<p class="small">Encontramos <b>15 piezas</b> en «TaxBox_Parrilla_Nov_Semanas2a4». Así se acomodan las columnas:</p>
        <div class="table-wrap" style="max-height:300px;overflow:auto"><table><thead><tr><th>Columna en tu hoja</th><th>Campo en la herramienta</th><th></th></tr></thead>
        <tbody>${cols.map(([a,b])=>`<tr><td>${esc(a)}</td><td><b>${esc(b)}</b></td><td class="ok-mark">✓</td></tr>`).join('')}</tbody></table></div>`}`,
      m.step === 1 ? `<button class="btn" data-action="close-modal">Cancelar</button>${primary('Revisar columnas','type="submit" form="f-import"')}`
                   : `<button class="btn" data-action="import-back">Atrás</button>${primary('Importar 15 piezas','data-action="import-do"')}`);
  }
  if (m.type === 'csv'){
    const MAP = {
      Meta:[['Nombre de la campaña','Campaña'],['Importe gastado (MXN)','Inversión'],['Alcance','Alcance'],['Impresiones','Impresiones'],['Clics en el enlace','Clics'],['Conversaciones con mensajes iniciadas','Conversaciones']],
      TikTok:[['Campaign name','Campaña'],['Cost','Inversión'],['Reach','Alcance'],['Impressions','Impresiones'],['Clicks (destination)','Clics'],['Conversions','Conversaciones']],
      Google:[['Campaña','Campaña'],['Costo','Inversión'],['Impr.','Impresiones'],['Clics','Clics'],['Conversiones','Conversaciones']],
    };
    const pl = m.pl || 'Meta';
    return wrap('Subir datos de campañas', `${esc(bname(currentBrand()))} · campañas`, `
      <div class="form-grid">
        <div class="field"><label for="csv-pl">Plataforma</label><select class="input" id="csv-pl" data-change="csv-pl">${['Meta','TikTok','Google'].map(p=>`<option ${p===pl?'selected':''}>${p}</option>`).join('')}</select></div>
        <div class="field"><label for="csv-file">Archivo CSV exportado</label><input class="input" type="file" id="csv-file" accept=".csv,text/csv"></div>
      </div>
      ${m.file ? `<p class="small"><span class="ok-mark">✓</span> <b>${esc(m.file.name)}</b> · ${m.file.rows} filas · ${m.file.headers} columnas detectadas</p>` : `<p class="muted small">Exporta el reporte desde el administrador de anuncios de ${pl} con el rango de fechas del periodo. No hace falta acomodar nada.</p>`}
      <div><span class="eyebrow">Columnas que se leen de ${pl}</span>
      <div class="table-wrap" style="margin-top:8px"><table><thead><tr><th>Columna en el CSV</th><th>Indicador</th></tr></thead><tbody>${MAP[pl].map(([a,b])=>`<tr><td>${esc(a)}</td><td><b>${b}</b></td></tr>`).join('')}</tbody></table></div></div>
      <p class="muted small">CTR, CPC y costo por conversación se calculan solos.</p>`,
      `<button class="btn" data-action="close-modal">Cancelar</button>${primary(m.file?'Cargar datos':'Usar archivo de ejemplo','data-action="csv-do"')}`);
  }
  if (m.type === 'publish'){
    const r = REPORTS[currentBrand()][state.rmode];
    return wrap('Publicar reporte', `${esc(bname(currentBrand()))} · ${esc(r.period)}`, `
      <p>Al publicarlo, ${esc(bname(currentBrand()))} lo ve en su portal, en Reportes.</p>
      <label class="check"><input type="checkbox" id="pub-mail" checked> Avisar al cliente por correo</label>
      <label class="check"><input type="checkbox" id="pub-check"> Revisé que los números coinciden con las plataformas</label>
      <span class="error" id="pub-err"></span>`,
      `<button class="btn" data-action="close-modal">Cancelar</button>${primary('Publicar','data-action="publish-do"')}`);
  }
  if (m.type === 'reset'){
    return wrap('Nueva contraseña', `Usuario · ${esc(m.user)}`, `
      <p>Esta es la contraseña temporal. Al entrar, el sistema le pide crear una propia.</p>
      <div class="pass" id="tmp-pass">${esc(m.pass)}</div>
      <p class="muted small">Compártela por WhatsApp o en persona. No se vuelve a mostrar.</p>`,
      `<button class="btn" data-action="copy-pass">Copiar</button>${primary('Listo','data-action="close-modal"')}`);
  }
  return '';
}

/* ============================================================
   RENDER Y EVENTOS
   ============================================================ */
const VIEWS = {inicio:viewInicio, mis:viewMis, tablero:viewTablero, backlog:viewBacklog, parrilla:viewParrilla, campanas:viewCampanas, reportes:viewReportes, accesos:viewAccesos};
function render(){
  if (!state.user){ $('#app').innerHTML = viewLogin(); return; }
  $('#app').innerHTML = shell((VIEWS[state.view] || viewInicio)());
  bindDnD();
}
function setUser(u, view){
  state.user = u; state.loginErr = ''; state.modal = null; state.open = null;
  state.brand = u.role === 'cliente' && allowedBrands(u).length === 1 ? allowedBrands(u)[0].id : 'all';
  const allowed = navFor(u.role).map(n => n[0]);
  state.view = allowed.includes(view) ? view : homeFor(u.role);
  if (!MULTI_VIEWS.includes(state.view) && state.brand === 'all') state.brand = allowedIds()[0];
  render(); window.scrollTo(0,0);
}
function login(username, pass){
  const u = USERS.find(x => x.user === username.trim().toLowerCase());
  if (!u || pass !== 'demo'){ state.loginErr = 'Usuario o contraseña incorrectos. En el prototipo la contraseña es «demo».'; render(); return; }
  setUser(u);
}
function go(view){
  state.view = view; state.open = null;
  if (!MULTI_VIEWS.includes(view) && state.brand === 'all') state.brand = allowedIds()[0];
  render(); window.scrollTo(0,0);
}
function bindDnD(){
  if (isClient()) return;
  document.querySelectorAll('.card[draggable]').forEach(card => {
    card.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', card.dataset.task); card.classList.add('dragging'); });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
  });
  document.querySelectorAll('.col[data-col]').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', () => col.classList.remove('over'));
    col.addEventListener('drop', e => {
      e.preventDefault(); col.classList.remove('over');
      const t = TASKS.find(x => x.id === e.dataTransfer.getData('text/plain'));
      if (t && t.st !== col.dataset.col){ t.st = col.dataset.col; render(); toast(`Movida a «${COLS.find(c=>c.id===t.st).label}»`); }
    });
  });
}
const findPiece = (brand, id) => (PARRILLA[brand]||[]).find(x => x.id === id);
const addMsg = (r, text) => r.thread.push({who: state.user.name, t:text, when: fdate(TODAY)});

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || !el.dataset.action) return;
  const a = el.dataset.action, id = el.dataset.id;
  if (a === 'close-modal'){ if (e.target === el || el.tagName === 'BUTTON'){ state.modal = null; render(); } return; }
  switch (a){
    case 'jump': setUser(USERS.find(u => u.user === el.dataset.user), el.dataset.view); break;
    case 'logout': state.user = null; state.modal = null; render(); break;
    case 'nav': go(el.dataset.view); break;
    case 'open-brand': state.brand = el.dataset.brand; go(isClient() ? 'parrilla' : 'tablero'); break;
    case 'goto-piece': state.brand = el.dataset.brand; state.pmode = 'tabla'; state.view = 'parrilla'; state.open = id; render();
      setTimeout(() => document.querySelector(`tr[data-id="${id}"]`)?.scrollIntoView({behavior:'smooth', block:'center'}), 30); break;
    case 'open-task': state.modal = {type:'task', id: el.dataset.task}; render(); break;
    case 'toggle-row': if (e.target.closest('.detail')) return; state.open = state.open === id ? null : id; render(); break;
    case 'pmode': state.pmode = el.dataset.mode; render(); break;
    case 'platform': state.platform = el.dataset.pl; render(); break;
    case 'rmode': state.rmode = el.dataset.mode; render(); break;
    case 'advance': { const t = TASKS.find(x => x.id === id); t.st = NEXT[t.st][0]; render(); toast(`Tarea movida a «${COLS.find(c=>c.id===t.st).label}».`); break; }
    case 'to-approval': { const r = findPiece(el.dataset.brand, id); r.st = 'Por aprobar'; render(); toast(`${id} enviada al cliente para aprobación.`); break; }
    case 'schedule': { const r = findPiece(el.dataset.brand, id); r.st = 'Programado'; render(); toast(`${id} quedó programada.`); break; }
    case 'approve': { const r = findPiece(currentBrand(), id); r.st = 'Autorizado'; addMsg(r, 'Autorizó la pieza.'); render(); toast(`${id} autorizada. Le avisamos al equipo.`); break; }
    case 'request-changes': { const txt = $('#cm-'+id).value.trim(); if (!txt){ $('#err-'+id).textContent = 'Cuéntanos qué cambio necesitas para poder atenderlo.'; $('#cm-'+id).focus(); return; }
      const r = findPiece(currentBrand(), id); r.st = 'Cambios'; addMsg(r, txt); render(); toast(`Cambios pedidos en ${id}.`); break; }
    case 'comment': { const txt = $('#cm-'+id).value.trim(); if (!txt){ $('#err-'+id).textContent = 'Escribe un comentario antes de enviarlo.'; return; }
      addMsg(findPiece(currentBrand(), id), txt); render(); toast('Comentario enviado.'); break; }
    case 'approve-all': { const rows = PARRILLA[currentBrand()].filter(r => r.st === 'Por aprobar'); rows.forEach(r => { r.st = 'Autorizado'; addMsg(r, 'Autorizó la pieza.'); }); render(); toast(`${rows.length} piezas autorizadas.`); break; }
    case 'to-sprint': { const i = BACKLOG.findIndex(b => b.id === id), b = BACKLOG.splice(i,1)[0];
      TASKS.push({id:'t'+Date.now(), c:b.c, title:b.title, type:b.type, who: ['Diseño','Video'].includes(b.type)?'DI':b.type==='Community'?'CM':'JP', pts:b.pts, st:'todo', due:'2026-11-13'});
      render(); toast('Pasó al sprint 46, columna «Por hacer».'); break; }
    case 'm-newtask': state.modal = {type:'newtask', dest: el.dataset.dest}; render(); $('#nt-title')?.focus(); break;
    case 'm-newpiece': state.modal = {type:'newpiece'}; render(); break;
    case 'm-import': state.modal = {type:'import', step:1}; render(); $('#im-url')?.focus(); break;
    case 'import-back': state.modal.step = 1; render(); break;
    case 'import-do': state.modal = null; render(); toast('Listo: 15 piezas importadas con su estatus y comentarios.'); break;
    case 'm-csv': state.modal = {type:'csv', pl: state.platform === 'Todas' ? 'Meta' : state.platform}; render(); break;
    case 'csv-do': { const f = state.modal.file; state.modal = null; render(); toast(f ? `Cargamos ${f.rows} filas de ${f.name}.` : 'Cargamos el archivo de ejemplo. Los indicadores ya se actualizaron.'); break; }
    case 'm-publish': state.modal = {type:'publish'}; render(); break;
    case 'publish-do': { if (!$('#pub-check').checked){ $('#pub-err').textContent = 'Confirma que revisaste los números antes de publicar.'; return; }
      REPORTS[currentBrand()][state.rmode].published = fdate(TODAY); state.modal = null; render(); toast('Reporte publicado. El cliente ya lo puede ver.'); break; }
    case 'm-reset': state.modal = {type:'reset', user: el.dataset.user, pass: 'Puebla-' + (1000 + Math.floor(Math.random()*9000))}; render(); break;
    case 'copy-pass': { const p = state.modal.pass; try { navigator.clipboard.writeText(p).then(() => toast('Contraseña copiada.'), () => { getSelection().selectAllChildren($('#tmp-pass')); toast('Selecciónala y cópiala.'); }); } catch { getSelection().selectAllChildren($('#tmp-pass')); } break; }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.modal){ state.modal = null; render(); }
  if (e.key === 'Enter' && e.target.matches('.card[data-action="open-task"], tr.row-click')) e.target.click();
});
document.addEventListener('change', e => {
  const k = e.target.dataset.change;
  if (e.target.id === 'csv-file' && e.target.files[0]){
    const file = e.target.files[0], rd = new FileReader();
    rd.onload = () => { const lines = String(rd.result).split(/\r?\n/).filter(l => l.trim()); state.modal.file = {name:file.name, rows:Math.max(0, lines.length-1), headers:(lines[0]||'').split(/[,;\t]/).length}; render(); };
    rd.readAsText(file); return;
  }
  if (!k) return;
  if (k === 'brand'){ state.brand = e.target.value; state.open = null; render(); }
  if (k === 'as-user') setUser(USERS.find(u => u.user === e.target.value), state.view);
  if (k === 'csv-pl'){ state.modal.pl = e.target.value; render(); }
  if (k === 'piece-status'){ const r = findPiece(currentBrand(), e.target.dataset.id); r.st = e.target.value; render(); toast(`${r.id}: ${r.st}`); }
  if (k === 'task-status'){ const t = TASKS.find(x => x.id === e.target.dataset.id); t.st = e.target.value; render(); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.id;
  if (f === 'login-form') login($('#lg-user').value, $('#lg-pass').value);
  if (f === 'new-user'){
    const name = $('#nu-name').value.trim(), user = $('#nu-user').value.trim().toLowerCase(), r = $('#nu-role').value, [kind, val] = $('#nu-acc').value.split(':');
    if (!name || !user){ $('#nu-err').textContent = 'Escribe nombre y usuario.'; return; }
    if (USERS.some(u => u.user === user)){ $('#nu-err').textContent = 'Ese usuario ya existe. Elige otro.'; return; }
    if (r === 'equipo' && USERS.filter(u => u.role !== 'cliente').length >= 5){ $('#nu-err').textContent = 'Ya usas los 5 lugares de equipo.'; return; }
    const nu = {user, name, role:r, ini:name.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase()};
    if (r === 'equipo') nu.accounts = 'Todas';
    else if (kind === 'client'){ nu.client = val; nu.accounts = CLIENTS.find(c=>c.id===val).name; }
    else { nu.brands = [val]; nu.accounts = 'Solo ' + bname(val); }
    USERS.push(nu);
    state.modal = {type:'reset', user, pass:'Puebla-' + (1000 + Math.floor(Math.random()*9000))}; render(); toast(`Usuario «${user}» creado.`);
  }
  if (f === 'f-newtask'){
    const title = $('#nt-title').value.trim();
    if (!title){ $('#nt-err').textContent = 'Escribe qué hay que hacer.'; $('#nt-title').focus(); return; }
    const t = {id:'t'+Date.now(), c:$('#nt-brand').value, title, type:$('#nt-type').value, who:$('#nt-who').value, pts:+$('#nt-pts').value, st:'todo', due:$('#nt-due').value || '2026-11-13'};
    if ($('#nt-dest').value === 'backlog'){ BACKLOG.unshift({id:'b'+Date.now(), c:t.c, title, type:t.type, pts:t.pts, prio:'Media'}); toast('Agregada al backlog.'); }
    else { TASKS.push(t); toast('Tarea agregada a «Por hacer».'); }
    state.modal = null; render();
  }
  if (f === 'f-newpiece'){
    const hook = $('#np-hook').value.trim(), date = $('#np-date').value, pid = $('#np-id').value.trim();
    if (!hook || !date || !pid){ $('#np-err').textContent = 'Necesitamos al menos ID, fecha y gancho.'; return; }
    const c = currentBrand(); PARRILLA[c] = PARRILLA[c] || [];
    PARRILLA[c].push({id:pid, f:date, h:$('#np-hour').value, pilar:$('#np-pilar').value, canal:$('#np-canal').value, fmt:$('#np-fmt').value, hook, guia:$('#np-guia').value, cont:$('#np-cont').value, cap:$('#np-cap').value, pauta:$('#np-pauta').value || 'Por definir', wa:$('#np-wa').value, st:$('#np-st').value, thread:[], nota:''});
    PARRILLA[c].sort((x,y) => x.f.localeCompare(y.f));
    state.modal = null; state.open = pid; render(); toast(`${pid} agregada a la parrilla.`);
  }
  if (f === 'f-import'){
    const url = $('#im-url').value.trim();
    if (!/^https:\/\/docs\.google\.com\/spreadsheets\//.test(url)){ $('#im-err').textContent = 'Pega un enlace de Google Sheets (empieza con https://docs.google.com/spreadsheets/).'; return; }
    state.modal.url = url; state.modal.step = 2; render();
  }
});
render();
</script>
